name: Build patched ClashMeta (arm64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upstream release tag'
        required: true
        type: choice
        default: v2.11.33
        options:
          - v2.11.33

permissions:
  contents: write

jobs:
  build-arm64-patched:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo (patches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout upstream source with submodules
        uses: actions/checkout@v4
        with:
          repository: MetaCubeX/ClashMetaForAndroid
          ref: ${{ github.event.inputs.release_tag || 'v2.11.33' }}
          submodules: recursive
          path: src
          fetch-depth: 0

      - name: "Determine patch to apply (strict: require versioned patch)"
        id: patch
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ github.event.inputs.release_tag || 'v2.11.33' }}"
          PATCH_FILE="patches/${RELEASE_TAG}.patch"
          if [ -f "${{ github.workspace }}/$PATCH_FILE" ]; then
            PATCH="$PATCH_FILE"
          else
            echo "No patch found for upstream tag '${RELEASE_TAG}'."
            echo "Expected: $PATCH_FILE"
            echo "Available patches:"
            ls -la patches || true
            exit 1
          fi

          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Apply patch
        working-directory: src
        run: |
          set -euo pipefail
          PATCH_PATH="${{ github.workspace }}/${{ steps.patch.outputs.patch }}"
          if [ -f "$PATCH_PATH" ]; then
            echo "Applying patch: $PATCH_PATH"
            patch -p1 --batch -i "$PATCH_PATH"
          else
            echo "Patch not found: $PATCH_PATH - continuing without applying"
            exit 1
          fi

      - name: Copy release keystore if present
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/release.keystore" ]; then
            echo "Copying release.keystore to src/"
            cp "$GITHUB_WORKSPACE/release.keystore" src/release.keystore
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Go Patches from upstream
        run: |
          set -euo pipefail
          cd $(go env GOROOT)
          if [ -d "${{ github.workspace }}/src/.github/patch" ]; then
            for p in ${{ github.workspace }}/src/.github/patch/*.patch; do
              if [ -f "$p" ]; then
                echo "Applying Go patch: $p"
                patch --verbose -p 1 < "$p"
              fi
            done
          fi

      - name: Update CA certificates
        working-directory: src
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          mkdir -p core/src/foss/golang/clash/component/ca
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Ensure gradlew is executable
        run: |
          if [ -f src/gradlew ]; then chmod +x src/gradlew; fi

      - name: Build arm64 APK (assembleMetaRelease)
        working-directory: src
        run: |
          set -euo pipefail
          echo "Building arm64-v8a APK (assembleMetaRelease)"
          ./gradlew app:assembleMetaRelease -PabiFilters=arm64-v8a --no-daemon --stacktrace

      - name: Find and rename APK to add -Cellular suffix
        id: findapk
        run: |
          set -euo pipefail
          APK_PATH=$(find src/app/build/outputs -type f -name "*arm64-v8a*release*.apk" | head -n 1 || true)
          if [ -z "$APK_PATH" ]; then
            echo "No arm64 release APK found under src/app/build/outputs"
            find src/app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          DIR=$(dirname "$APK_PATH")
          BASE=$(basename "$APK_PATH")
          NEWNAME="${BASE%.apk}-Cellular.apk"
          mv "$APK_PATH" "$DIR/$NEWNAME"
          echo "Renamed to: $DIR/$NEWNAME"
          echo "APK_FILE=$DIR/$NEWNAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-cellular
          path: ${{ steps.findapk.outputs.APK_FILE }}

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cellular-${{ steps.patch.outputs.release_tag }}-${{ github.run_number }}
          name: Clash Meta Cellular ${{ steps.patch.outputs.release_tag }} build ${{ github.run_number }}
          body: |
            Auto build from workflow run ${{ github.run_id }}.
            Upstream tag: ${{ steps.patch.outputs.release_tag }}
            Commit: ${{ github.sha }}
          prerelease: true
          files: ${{ steps.findapk.outputs.APK_FILE }}
